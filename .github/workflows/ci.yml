name: Verify career demo
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: concierge_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U concierge -d concierge_test" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pip install -r backend/requirements.txt
      - run: pip install ruff==0.11.10
      - run: pnpm install --frozen-lockfile
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check backend ai database scripts
      - run: pnpm lint
      - run: python -m pytest backend/tests/test_api.py backend/tests/test_access.py -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://concierge:testonly@localhost:5432/concierge_test
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start local test services
        env:
          REQUIRE_PROFILE_OWNERSHIP: "true"
          COOKIE_SECURE: "false"
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/concierge-api.log 2>&1 &
          pnpm exec next start frontend --hostname 127.0.0.1 > /tmp/concierge-web.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health && curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
